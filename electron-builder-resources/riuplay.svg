<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- RiuPlay logo. Licensed GPL-3.0-only with the rest of RiuPlay. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="240" rx="120" fill="url(#shine)"/>
  <!-- Play triangle with rounded joins -->
  <path d="M200 150 L372 256 L200 362 Z" fill="#ffffff" stroke="#ffffff" stroke-width="36" stroke-linejoin="round"/>
  <!-- Three sound/progress ticks: video, manga, audio -->
  <circle cx="132" cy="196" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="132" cy="256" r="14" fill="#ffffff" opacity="0.7"/>
  <circle cx="132" cy="316" r="14" fill="#ffffff" opacity="0.5"/>
</svg>
